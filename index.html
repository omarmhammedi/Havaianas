<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campagne Havaianas Automne</title>
<meta name="description" content="Havaianas, campagne automne : films et galerie photo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Maison Neue: drop your licensed files into /fonts with these names.
     If they are missing, the visitor's installed Maison Neue is used, then DM Sans. */
  @font-face{font-family:"Maison";src:local("Maison Neue Bold"),local("MaisonNeue-Bold"),url("fonts/MaisonNeue-Bold.woff2") format("woff2"),url("fonts/MaisonNeue-Bold.woff") format("woff");font-weight:700;font-display:swap}
  @font-face{font-family:"Maison";src:local("Maison Neue Medium"),local("MaisonNeue-Medium"),url("fonts/MaisonNeue-Medium.woff2") format("woff2"),url("fonts/MaisonNeue-Medium.woff") format("woff");font-weight:500;font-display:swap}
  :root{
    --ground:#FFFAF0;
    --soft:#EFE8D8;
    --ink:#171411;
    --muted:#7B7468;
    --line:#D9CDB9;
    --red:#C8202F;
    --sun:#FFD15F;
    --shade:rgba(23,20,17,.95);
    --display:"Maison", "Maison Neue", "DM Sans", "Helvetica Neue", Arial, sans-serif;
    --sans:"Manrope", "Helvetica Neue", Arial, sans-serif;
    --gutter:clamp(16px, 4vw, 56px);
    --gallery-gap:18px;
    --gallery-columns:3;
    --feature-grid:repeat(3,minmax(0,1fr));
    --hero-overlap:clamp(64px,6vw,88px);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--sun);outline-offset:3px}

  .wrap{padding-inline:var(--gutter);max-width:1480px;margin-inline:auto}

  /* ---------- Header ---------- */
  .top{background:var(--red);color:#fff}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px}
  .nav img{height:40px;width:auto}
  .nav .wordmark{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
  .nav span{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
  .hero{display:grid;grid-template-columns:var(--feature-grid);gap:var(--gallery-gap);align-items:start;padding-top:clamp(40px,4vw,56px)}
  .hero-text{grid-column:1 / -2;align-self:center;min-width:0;display:flex;flex-direction:column;gap:clamp(20px,3vw,32px);padding-block:clamp(44px,7vw,96px) clamp(60px,7vw,96px)}
  .eyebrow{margin:0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--sun);display:flex;align-items:center;gap:12px}
  .eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
  h1{margin:0;font-family:var(--display);font-weight:700;line-height:.92;letter-spacing:-.03em;font-size:clamp(52px,7.6vw,116px);text-wrap:balance}
  h1 .line{display:block}
  h1 .accent{color:var(--sun)}
  .meta{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px;font-weight:500;color:rgba(255,255,255,.85)}
  .meta b{color:#fff;font-weight:800}

  .film{position:relative;aspect-ratio:9/16;background:#111;overflow:hidden;border-radius:14px;max-width:100%}
  .film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
  .hero .film{grid-column:-2 / -1;z-index:3;height:auto;width:100%;margin-bottom:calc(-1 * var(--hero-overlap));box-shadow:0 24px 56px rgba(60,10,10,.22)}

  .sound{position:absolute;left:14px;bottom:14px;max-width:calc(100% - 28px);z-index:2;display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 11px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.18);transition:transform .2s ease, background .2s ease}
  .sound:hover{transform:translateY(-1px);background:#fff}
  .sound svg{width:18px;height:18px;flex:none}
  .sound .on,.sound[aria-pressed="true"] .off{display:none}
  .sound[aria-pressed="true"] .on{display:block}

  /* ---------- Gallery ---------- */
  .gallery-head{display:grid;grid-template-columns:var(--feature-grid);gap:var(--gallery-gap);padding-block:clamp(32px,5vw,56px) 24px}
  .gallery-intro{grid-column:1 / -2;display:flex;justify-content:space-between;align-items:baseline;gap:12px 24px;flex-wrap:wrap;min-width:0}
  h2{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-size:clamp(34px,4.4vw,60px);line-height:1}
  h2 em{font-style:normal;color:var(--red)}
  .hint{margin:0;font-size:13px;color:var(--muted)}

  .masonry{position:relative;columns:3 220px;column-gap:var(--gallery-gap);padding-bottom:clamp(48px,8vw,120px)}
  .tile{break-inside:avoid;margin:0 0 var(--gallery-gap);position:relative}
  .masonry.is-positioned{columns:auto}
  .masonry.is-positioned .tile{position:absolute;margin:0}
  .tile .film{width:100%}

  .photo{display:block;width:100%;padding:0;border:0;background:var(--soft);cursor:zoom-in;overflow:hidden;border-radius:14px;aspect-ratio:4/5}
  .photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1), opacity .5s ease;opacity:0}
  .photo img.loaded{opacity:1}
  .photo:hover img{transform:scale(1.035)}

  footer{border-top:1px solid var(--line);font-weight:500;padding-block:24px 36px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.04em}

  /* ---------- Lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;transition:opacity .3s ease, visibility 0s linear .3s;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .lightbox.open{opacity:1;visibility:visible;transition:opacity .3s ease}
  .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,3vw,32px);color:#fff}
  .lb-count{font-size:13px;letter-spacing:.14em;font-variant-numeric:tabular-nums;opacity:.8}
  .lb-stage{position:relative;display:grid;place-items:center;min-height:0;padding:0 clamp(16px,7vw,110px)}
  .lb-stage img{max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);max-width:100%;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);transition:opacity .25s ease}
  .lb-stage img.fading{opacity:0}
  .lb-btn{border:0;background:rgba(255,255,255,.1);color:#fff;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s ease}
  .lb-btn:hover{background:var(--red)}
  .lb-btn svg{width:22px;height:22px}
  .lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%)}
  .lb-prev{left:clamp(8px,2vw,32px)}
  .lb-next{right:clamp(8px,2vw,32px)}
  .lb-foot{height:24px}

  @media (max-width:1100px){
    :root{--gallery-columns:2;--feature-grid:minmax(0,1fr) minmax(0,.95fr);--hero-overlap:64px}
    h1{font-size:clamp(48px,6.6vw,72px)}
    .gallery-intro{align-items:flex-start;flex-direction:column}
  }
  @media (max-width:700px){
    :root{--gallery-gap:10px;--hero-overlap:32px}
    .lb-stage img{max-height:calc(100dvh - 220px)}
    .hero{grid-template-columns:1fr;gap:36px}
    .hero-text{grid-column:1 / -1;padding:0 0 8px;gap:20px}
    h1{font-size:clamp(52px,12vw,80px)}
    .hero .film{grid-column:1 / -1;width:100%;max-width:380px;justify-self:center}
    .nav img{height:32px}
    .gallery-head{display:block;padding-top:calc(var(--hero-overlap) + 40px)}
    .gallery-intro{gap:12px}
    .masonry{columns:2 140px}
    .lb-prev,.lb-next{top:auto;bottom:-64px;transform:none}
    .lb-foot{height:72px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <nav class="nav">
      <img src="images/kreedns-mark.png" alt="Kreedns" width="240" height="228">
      <span>Havaianas × Kreedns</span>
    </nav>
    <header class="hero">
      <div class="hero-text">
        <p class="eyebrow">Photoshoot</p>
        <h1><span class="line">Campagne</span><span class="line accent">Havaianas</span><span class="line">Automne</span></h1>
      </div>

      <div class="film" id="heroFilm">
        <video id="heroPlayer" autoplay muted loop playsinline preload="auto" poster="https://video.gumlet.io/65afbecf233c3b07ef080c55/6ab4877d6cc97c47e4fcdc7b/thumbnail-1-0.png" data-src="https://video.gumlet.io/65afbecf233c3b07ef080c55/6ab4877d6cc97c47e4fcdc7b/main.m3u8" aria-label="Campagne Havaianas Automne, film principal"></video>
        <button class="sound" id="heroSound" type="button" aria-pressed="false" aria-label="Activer le son du film principal">
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
          <span class="label">Activer le son</span>
        </button>
      </div>
    </header>
  </div>
</div>

<div class="wrap">
  <main>
    <div class="gallery-head">
      <div class="gallery-intro">
        <h2>Galerie</h2>
        <p class="hint">Cliquez sur une photo pour l’agrandir.</p>
      </div>
    </div>

    <div class="masonry" id="masonry">
      <div class="tile reel" id="reel">
        <div class="film">
          <video id="reelPlayer" autoplay muted loop playsinline preload="auto" poster="https://video.gumlet.io/65afbecf233c3b07ef080c55/6ab4877d6cc97c47e4fcdc7c/thumbnail-1-0.png" data-src="https://video.gumlet.io/65afbecf233c3b07ef080c55/6ab4877d6cc97c47e4fcdc7c/main.m3u8" aria-label="Campagne Havaianas Automne, second film"></video>
          <button class="sound" id="reelSound" type="button" aria-pressed="false" aria-label="Activer le son du second film">
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            <span class="label">Activer le son</span>
          </button>
        </div>
      </div>
      <!-- photographs are inserted here -->
    </div>
  </main>

  <footer>
    <span>Campagne Havaianas Automne</span>
    <span>Présenté par Kreedns</span>
  </footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visionneuse photo" aria-hidden="true">
  <div class="lb-bar">
    <span class="lb-count" id="lbCount">01 / 47</span>
    <button class="lb-btn" id="lbClose" type="button" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
    <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Photo précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Photo suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="lb-foot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
  /* ---------- Photographs ---------- */
  var TOTAL = 47;
  var photos = [];
  for (var i = 1; i <= TOTAL; i++) {
    var n = 'havaianas-automne-' + (i < 10 ? '0' + i : i) + '.jpg';
    photos.push({ thumb: 'images/thumb/' + n, full: 'images/full/' + n });
  }

  var masonry = document.getElementById('masonry');
  var frag = document.createDocumentFragment();
  photos.forEach(function(p, idx){
    var tile = document.createElement('div');
    tile.className = 'tile';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'photo';
    btn.setAttribute('aria-label', 'Ouvrir la photo ' + (idx + 1) + ' sur ' + TOTAL);
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = 'Campagne Havaianas Automne, photo ' + (idx + 1);
    img.onload = function(){ img.classList.add('loaded'); };
    img.src = p.thumb;
    if (img.complete) img.classList.add('loaded');
    btn.appendChild(img);
    btn.addEventListener('click', function(){ openLightbox(idx); });
    tile.appendChild(btn);
    frag.appendChild(tile);
  });
  masonry.appendChild(frag);

  /* Keep the gallery clear of the header film, without moving either player. */
  var heroLayout = document.querySelector('.hero');
  var heroFilm = document.getElementById('heroFilm');
  var tiles = Array.prototype.slice.call(masonry.children);
  var layoutFrame = 0;

  function layoutMasonry(){
    layoutFrame = 0;
    var mobile = window.matchMedia('(max-width:700px)').matches;
    var count = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--gallery-columns'), 10);
    var styles = getComputedStyle(masonry);
    var gap = parseFloat(styles.columnGap);
    var width = masonry.clientWidth;
    var widths = mobile ? [(width - gap) / 2, (width - gap) / 2] : getComputedStyle(heroLayout).gridTemplateColumns.split(' ').map(parseFloat);
    if (widths.length !== count || widths.some(function(w){ return !isFinite(w) || w <= 0; })) return;

    var heights = widths.map(function(){ return 0; });
    var lefts = widths.map(function(_, col){
      return widths.slice(0, col).reduce(function(sum, w){ return sum + w + gap; }, 0);
    });
    if (!mobile) {
      heights[count - 1] = Math.max(0, heroFilm.getBoundingClientRect().bottom - masonry.getBoundingClientRect().top + gap);
    }
    masonry.classList.add('is-positioned');
    tiles.forEach(function(tile){
      var col = heights.indexOf(Math.min.apply(null, heights));
      tile.style.width = widths[col] + 'px';
      tile.style.left = lefts[col] + 'px';
      tile.style.top = heights[col] + 'px';
      heights[col] += tile.getBoundingClientRect().height + gap;
    });
    masonry.style.height = Math.ceil(Math.max.apply(null, heights) - gap + parseFloat(styles.paddingBottom)) + 'px';
  }
  function scheduleMasonry(){
    if (!layoutFrame) layoutFrame = requestAnimationFrame(layoutMasonry);
  }
  layoutMasonry();
  window.addEventListener('resize', scheduleMasonry);
  if (document.fonts) document.fonts.ready.then(scheduleMasonry);

  /* ---------- Films ---------- */
  var hero = document.getElementById('heroPlayer');
  var reel = document.getElementById('reelPlayer');
  var heroBtn = document.getElementById('heroSound');
  var reelBtn = document.getElementById('reelSound');

  function attach(v){
    var src = v.getAttribute('data-src');
    if (window.Hls && Hls.isSupported()) {
      var h = new Hls({ capLevelToPlayerSize: true });
      h.loadSource(src); h.attachMedia(v);
    } else { v.src = src; } // Safari and iPhone play HLS natively
  }
  attach(hero); attach(reel);
  // Make sure a film that should be playing starts once its stream is ready
  [hero, reel].forEach(function(v){
    v.addEventListener('canplay', function(){ if (v.paused) v.play().catch(function(){}); }, { once: true });
  });

  var state = 'none'; // which film has sound: 'hero' | 'reel' | 'none'

  function render(){
    heroBtn.setAttribute('aria-pressed', state === 'hero');
    heroBtn.querySelector('.label').textContent = state === 'hero' ? 'Couper le son' : 'Activer le son';
    heroBtn.setAttribute('aria-label', state === 'hero' ? 'Couper le son du film principal' : 'Activer le son du film principal');
    reelBtn.setAttribute('aria-pressed', state === 'reel');
    reelBtn.querySelector('.label').textContent = state === 'reel' ? 'Couper le son' : 'Activer le son';
    reelBtn.setAttribute('aria-label', state === 'reel' ? 'Couper le son du second film' : 'Activer le son du second film');
  }
  function setState(next){
    state = next;
    hero.muted = next !== 'hero';
    reel.muted = next !== 'reel';
    if (next === 'hero') { hero.volume = 1; hero.play().catch(function(){}); }
    if (next === 'reel') { reel.volume = 1; reel.play().catch(function(){}); }
    render();
  }

  // The main film tries to start with sound. If the browser refuses
  // (most do until the visitor has interacted with the page), it plays
  // muted and the sound turns on at the first click, tap or key press.
  var waitingForGesture = false;
  function startHero(){
    hero.muted = false; hero.volume = 1;
    var p = hero.play();
    if (p && p.then) {
      p.then(function(){ state = 'hero'; render(); })
       .catch(function(){
         hero.muted = true;
         hero.play().catch(function(){});
         waitingForGesture = true;
       });
    } else { state = 'hero'; render(); }
  }
  function firstGesture(){
    if (waitingForGesture) setState('hero');
    waitingForGesture = false;
    ['pointerdown','keydown','touchstart'].forEach(function(t){ document.removeEventListener(t, firstGesture, true); });
  }
  ['pointerdown','keydown','touchstart'].forEach(function(t){ document.addEventListener(t, firstGesture, true); });
  reel.muted = true; reel.play().catch(function(){});
  startHero();

  heroBtn.addEventListener('click', function(e){
    e.stopPropagation(); waitingForGesture = false;
    setState(state === 'hero' ? 'none' : 'hero');
  });
  reelBtn.addEventListener('click', function(e){
    e.stopPropagation(); waitingForGesture = false;
    setState(state === 'reel' ? 'none' : 'reel');
  });

  /* ---------- Lightbox ---------- */
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCount = document.getElementById('lbCount');
  var current = 0, lastFocus = null;

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function show(idx){
    current = (idx + TOTAL) % TOTAL;
    lbImg.classList.add('fading');
    var next = new Image();
    next.onload = next.onerror = function(){
      lbImg.src = photos[current].full;
      lbImg.alt = 'Campagne Havaianas Automne, photo ' + (current + 1);
      lbImg.classList.remove('fading');
    };
    next.src = photos[current].full;
    lbCount.textContent = pad(current + 1) + ' / ' + TOTAL;
    // preload neighbours
    [current + 1, current - 1].forEach(function(k){ var im = new Image(); im.src = photos[(k + TOTAL) % TOTAL].full; });
  }
  function openLightbox(idx){
    lastFocus = document.activeElement;
    lbImg.src = photos[idx].thumb;
    show(idx);
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.getElementById('lbClose').focus();
  }
  function closeLightbox(){
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', function(){ show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', function(){ show(current + 1); });
  document.getElementById('lbStage').addEventListener('click', function(e){ if (e.target.id === 'lbStage') closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'ArrowLeft') show(current - 1);
  });
  var tx = null;
  lb.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    tx = null;
  });
})();
</script>
</body>
</html>
